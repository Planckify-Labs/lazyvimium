- name: lazyvimium.enabled
  value: true

- name: lazyvimium.leader
  value: "<Space>"

- name: lazyvimium.timeoutlen
  value: 300 # in milliseconds; LazyVim lowers vim's 1000 for which-key

- name: lazyvimium.statusline.enabled
  value: true

- name: lazyvimium.ublock.enabled
  value: true # install uBlock Origin from AMO when it is missing; turned off when the user removes it

- name: lazyvimium.agent.default
  value: "" # an agent id (claude, codex, cursor, antigravity, opencode); empty picks the first installed

- name: lazyvimium.agent.layout
  value: "float" # float over the page, slide in from the side and hide when the mouse leaves, or split beside the tab

- name: lazyvimium.agent.side
  value: "right" # the side the agent panel slides in from: left or right

- name: lazyvimium.agent.width
  value: 420 # the agent panel's width, in pixels

- name: lazyvimium.agent.split-fallback
  value: "float" # how a split agent panel lays out while the tab has no room for it: float or slide

- name: lazyvimium.theme
  value: "" # JSON overrides for lazyvimium's colors, see ui/LazyvimiumTheme.sys.mjs

- name: lazyvimium.agent.log.enabled
  value: true # a JSONL trace per conversation in <profile>/lazyvimium/agent/logs, <leader>al opens it

- name: lazyvimium.agent.log.stdout
  value: false # also a one-line summary per entry on stdout; npm run dev turns it on

- name: lazyvimium.agent.a11y
  value: false # agents read control names, descriptions and states from Gecko's accessibility tree; off by default: it keeps the engine on in the page's process (tens of MB, slower loads) and adds about 1% to what an agent reads
